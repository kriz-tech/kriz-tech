<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="800" height="170" role="img" aria-label="Animated pixel ninja running through a stream of biomedical data" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .frame{fill:#0a192f;stroke:#64ffda;stroke-opacity:.35}
    .ground{stroke:#64ffda;stroke-width:3;stroke-dasharray:24 16;animation:ground .5s linear infinite}
    .ground2{stroke:#1f6feb;stroke-width:2;stroke-dasharray:6 12;animation:ground2 1.2s linear infinite}
    .bits{font:11px 'Courier New',monospace;fill:#64ffda;opacity:.5;animation:bits 16s linear infinite}
    .bits2{font:11px 'Courier New',monospace;fill:#5ccfe6;opacity:.4;animation:bits 22s linear infinite;animation-delay:-9s}
    .label{font:11px 'Courier New',monospace;fill:#8892b0}
    .live{font:11px 'Courier New',monospace;fill:#5ccfe6;animation:blink 1.2s steps(2,start) infinite}
    .bob{animation:bob .35s ease-in-out infinite}
    .legA{transform-box:fill-box;transform-origin:50% 0;animation:legA .7s ease-in-out infinite}
    .legB{transform-box:fill-box;transform-origin:50% 0;animation:legB .7s ease-in-out infinite}
    .armA{transform-box:fill-box;transform-origin:50% 10%;animation:legB .7s ease-in-out infinite}
    .armB{transform-box:fill-box;transform-origin:50% 10%;animation:legA .7s ease-in-out infinite}
    .tail1{transform-box:fill-box;transform-origin:100% 50%;animation:tail .35s ease-in-out infinite}
    .tail2{transform-box:fill-box;transform-origin:100% 50%;animation:tail .35s ease-in-out infinite reverse}
    .star{transform-box:fill-box;transform-origin:50% 50%;animation:throw 2.4s linear infinite}
    .star2{transform-box:fill-box;transform-origin:50% 50%;animation:throw 2.4s linear infinite;animation-delay:-1.2s}
    @keyframes ground{to{stroke-dashoffset:40}}
    @keyframes ground2{to{stroke-dashoffset:18}}
    @keyframes bits{from{transform:translateX(820px)}to{transform:translateX(-950px)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes legA{0%,100%{transform:rotate(35deg)}50%{transform:rotate(-35deg)}}
    @keyframes legB{0%,100%{transform:rotate(-35deg)}50%{transform:rotate(35deg)}}
    @keyframes tail{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
    @keyframes throw{0%{transform:translateX(0) rotate(0deg);opacity:0}8%{opacity:1}90%{opacity:1}100%{transform:translateX(560px) rotate(1080deg);opacity:0}}
    @keyframes blink{50%{opacity:0}}
  </style>

  <rect class="frame" x="1" y="1" width="798" height="168" rx="10"/>

  <text class="bits" x="0" y="28">01001 ECG 1101 EEG 0110 PPG 1011 SpO2 0101 SELECT * FROM signals; 1100 ETL 0110 YOLOv8 1011 FHIR 0101 pandas 1001</text>
  <text class="bits2" x="0" y="50">1011 python 0010 OpenCV 1100 pipeline 0110 clean 1010 analyze 0101 insights 1101 healthcare 0011 data 1001</text>

  <line class="ground" x1="0" y1="132" x2="800" y2="132"/>
  <line class="ground2" x1="0" y1="144" x2="800" y2="144"/>

  <g transform="translate(250,96)"><polygon class="star" points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2" fill="#5ccfe6"/></g>
  <g transform="translate(250,112)"><polygon class="star2" points="0,-6 1.5,-1.5 6,0 1.5,1.5 0,6 -1.5,1.5 -6,0 -1.5,-1.5" fill="#64ffda"/></g>

  <g transform="translate(170,131)">
    <g class="bob">
      <g class="legA"><rect x="-6" y="-20" width="6" height="18" fill="#2b3b50"/><rect x="-7" y="-4" width="9" height="4" fill="#5ccfe6"/></g>
      <g class="legB"><rect x="0" y="-20" width="6" height="18" fill="#3d536d"/><rect x="-1" y="-4" width="9" height="4" fill="#64ffda"/></g>
      <g class="armA"><rect x="-3" y="-40" width="5" height="16" fill="#0b3d91"/></g>
      <rect x="-8" y="-41" width="16" height="21" fill="#1f6feb"/>
      <rect x="-8" y="-41" width="16" height="3" fill="#5ccfe6"/>
      <rect x="-8" y="-29" width="16" height="4" fill="#64ffda"/>
      <rect class="tail1" x="-20" y="-29" width="12" height="3" fill="#64ffda"/>
      <g class="armB"><rect x="-2" y="-40" width="5" height="16" fill="#2f81f7"/></g>
      <rect x="-9" y="-58" width="18" height="17" fill="#2b3b50"/>
      <rect x="-2" y="-52" width="11" height="6" fill="#ffd9b3"/>
      <rect x="3" y="-50" width="3" height="2" fill="#0a192f"/>
      <rect x="-10" y="-57" width="20" height="4" fill="#5ccfe6"/>
      <rect x="-2" y="-57" width="8" height="4" fill="#9ef6ff"/>
      <rect class="tail1" x="-32" y="-56" width="22" height="3" fill="#5ccfe6"/>
      <rect class="tail2" x="-28" y="-51" width="18" height="3" fill="#00b8d4"/>
    </g>
  </g>

  <text class="label" x="16" y="162">$ ./run_pipeline.sh --domain biomedical</text>
  <text class="live" x="784" y="162" text-anchor="end">&gt; running...</text>
</svg>
